<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flee Machine - Home</title>
  
  <style>
    /* Navigation Bar Styling */
    .navbar {
      background-color: #333;
      overflow: hidden;
      font-family: Arial, sans-serif;
      padding: 10px;
      margin-bottom: 20px;
    }
    .navbar a {
      float: left;
      color: white;
      text-align: center;
      padding: 14px 20px;
      text-decoration: none;
      font-size: 17px;
    }
    .navbar a:hover {
      background-color: #ddd;
      color: black;
    }
    .navbar a.active {
      background-color: #4CAF50;
      color: white;
    }

    /* Moving Image Container Configuration */
    .marquee-container {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      background: transparent;
    }

    /* Style your target image and attach the scroll animation */
    .scrolling-hammer {
      width: 900px; /* Change this number to make it bigger or smaller */
      height: auto;
      display: inline-block;
      animation: scroll-left 15s linear infinite; 
    }

    /* The path layout instructions from off-screen right to off-screen left */
    @keyframes scroll-left {
      0% {
        transform: translateX(100vw);
      }
      100% {
        transform: translateX(-100%);
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar Tabs -->
  <div class="navbar">
    <a class="active" href="index.html">Home</a>
    <a href="What the mandem are saying.html">Mandem's Monographs</a>
  </div>

  <p>HAVE YOU EVER WANTED A MACHINE THAT LETS YOU FLEE ANY FACILITY YOU WANT? WELL NOW YOU CAN WITH THE FLEE MACHINE</p>

  <!-- The moving element wrapped inside its boundary box -->
  <div class="marquee-container">
    <img src="images.jpg" alt="Flee the Facility Hammer" class="scrolling-hammer">
  </div>

  <p>ORDER THE FLEE MACHINE TODAY FOR GIVE OR TAKE £90 (MS Kotecha not included)</p>

</body>
</html>
